<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Great Lakes’ Art &amp; Music</title>
<style>
  :root { --bg:#f5f5f3; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd; --accent:#1d1d1b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141413; --card:#1f1f1d; --ink:#f2f2ee; --muted:#9c9c95; --line:#33332f; --accent:#f2f2ee; } }
  :root[data-theme="dark"] { --bg:#141413; --card:#1f1f1d; --ink:#f2f2ee; --muted:#9c9c95; --line:#33332f; --accent:#f2f2ee; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 16px; }
  input[type=search] { flex:1 1 220px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; }
  button.chip { padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; font:inherit; font-size:13px; }
  button.chip[aria-pressed="true"] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  input[type=date] { padding:6px 10px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); font:inherit; font-size:13px; color-scheme: light dark; }
  input[type=date].on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .count { color:var(--muted); font-size:13px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:grid; grid-template-columns: 1fr auto; gap:6px 16px; }
  .title { font-weight:600; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:4px; border:1px solid var(--line); color:var(--muted); margin-left:6px; vertical-align:middle; }
  .rec { font-size:12px; font-weight:600; padding:3px 9px; border-radius:4px; white-space:nowrap; align-self:start; }
  .rec.buy { background:#1f7a3d; color:#fff; }
  .rec.last { background:#b7791f; color:#fff; }
  .rec.soldout { background:var(--line); color:var(--muted); }
  .actions { grid-column: 1 / -1; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  a.ticket { color:var(--ink); font-weight:600; text-decoration:none; border-bottom:2px solid var(--ink); }
  .empty, .error { color:var(--muted); padding:32px 0; text-align:center; }
  .error { color:#b42318; }
  .tabs { display:flex; gap:6px; margin: 4px 0 20px; border-bottom:1px solid var(--line); }
  .tabs a { padding:10px 14px; color:var(--muted); text-decoration:none; font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a[aria-current="page"] { color:var(--ink); border-bottom-color:var(--ink); }
  select.venue { padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); font:inherit; font-size:13px; }
  .rec.new { background:#2b5fb3; color:#fff; }
  .side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .score { font-size:12px; font-weight:700; padding:3px 9px; border-radius:4px; border:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  .score.top { background:#6b3fa0; border-color:#6b3fa0; color:#fff; }
  .desc { grid-column:1 / -1; margin:2px 0 0; font-size:14px; }
  .why { grid-column:1 / -1; margin:0; font-size:13px; color:var(--muted); font-style:italic; }
  .sigs { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:6px; }
  .sig { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--line); color:var(--muted); }
  details.dates { grid-column:1 / -1; font-size:13px; }
  details.dates summary { cursor:pointer; color:var(--muted); }
  details.dates ul { margin:6px 0 0; padding-left:18px; }
  details.dates li { margin:2px 0; }
  details.dates a { color:var(--ink); }
  :root { --must:#b4361f; --must-bg:#fbf1ee; --rated:#1f7a3d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --must:#ff8a70; --must-bg:#2a1d19; --rated:#6fd394; } }
  :root[data-theme="dark"] { --must:#ff8a70; --must-bg:#2a1d19; --rated:#6fd394; }
  .section-head { margin:26px 0 4px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .section-head.must { color:var(--must); }
  .section-head.rated { color:var(--rated); }
  .section-head.rest { color:var(--muted); }
  .section-sub { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .card.must { border:1px solid var(--must); border-left:5px solid var(--must); background:var(--must-bg); padding:18px 18px 16px; }
  .card.must .title { font-size:19px; }
  .card.must .desc { font-size:15px; }
  .card.rated { border-left:4px solid var(--rated); }
  .card.rest { padding:10px 14px; }
  .card.rest .title { font-size:15px; font-weight:600; }
  .card.rest .desc { color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.rest .desc:hover { -webkit-line-clamp:unset; }
  .tier { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:4px; white-space:nowrap; }
  .tier.must { background:var(--must); color:#fff; }
  .tier.rated { border:1px solid var(--rated); color:var(--rated); }
  .press { grid-column:1 / -1; margin:0; font-size:13px; }
  .press b { color:var(--rated); font-weight:600; }
  .fans { grid-column:1 / -1; margin:0; font-size:12px; color:var(--muted); }
  .pending { grid-column:1 / -1; margin:0; font-size:12px; color:var(--muted); font-style:italic; }
  .act-right { display:flex; align-items:center; gap:14px; }
  .nope { background:none; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font:inherit; font-size:12px; color:var(--muted); cursor:pointer; }
  .nope:hover { border-color:var(--ink); color:var(--ink); }
  .card.leaving { opacity:0; transform:scale(.98); transition:opacity .2s, transform .2s; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:14px; display:flex; gap:14px; align-items:center; box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:20; max-width:calc(100% - 32px); }
  #toast[hidden] { display:none; }
  #toast button { background:none; border:0; color:inherit; font:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0; }
  .hidden-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--card); }
  .hidden-row .meta { margin-top:2px; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align:center; }
  @media (max-width:560px) { .card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Two Great Lakes’ Art &amp; Music</h1>
  <p class="sub">Our shows and exhibitions around New York, picked from the places we like. Updated every morning.</p>
  <nav class="tabs" aria-label="Sections">
    <a href="#music" data-tab="music" aria-current="page">Music</a>
    <a href="#art" data-tab="art">Art</a>
  </nav>

  <section id="music-section">
  <div class="bar">
    <input type="search" id="q" placeholder="Search artist, venue, or show" aria-label="Search">
  </div>
  <div class="bar" id="genres" role="group" aria-label="Genre">
    <button class="chip" data-genre="All" aria-pressed="true">All</button>
    <button class="chip" data-genre="Rock" aria-pressed="false">Rock / Indie</button>
    <button class="chip" data-genre="Jazz" aria-pressed="false">Jazz</button>
    <button class="chip" data-genre="Classical" aria-pressed="false">Classical</button>
    <button class="chip" data-genre="Opera" aria-pressed="false">Opera</button>
    <button class="chip" data-genre="Other" aria-pressed="false">Other</button>
  </div>

  <div class="bar" id="when" role="group" aria-label="When">
    <button class="chip" data-when="all" aria-pressed="true">Any day</button>
    <button class="chip" data-when="tonight" aria-pressed="false">Tonight</button>
    <button class="chip" data-when="tomorrow" aria-pressed="false">Tomorrow</button>
    <button class="chip" data-when="week" aria-pressed="false">Next 7 days</button>
    <button class="chip" data-when="weekend" aria-pressed="false">This weekend</button>
    <button class="chip" data-when="month" aria-pressed="false">This month</button>
    <button class="chip" data-when="nextmonth" aria-pressed="false">Next month</button>
    <input type="date" id="day" aria-label="Pick a specific day">
  </div>
  <div class="bar" id="sort" role="group" aria-label="Sort">
    <button class="chip" data-sort="top" aria-pressed="true">Our picks first</button>
    <button class="chip" data-sort="must" aria-pressed="false">Can’t miss only</button>
    <button class="chip" data-sort="date" aria-pressed="false">By date</button>
    <button class="chip" data-sort="hidden" aria-pressed="false" id="hidden-chip">Hidden</button>
  </div>
  <p class="count" id="count"></p>

  <div id="list" aria-live="polite"><div class="empty">Loading shows…</div></div>
  <footer id="foot"></footer>
  </section>

  <section id="art-section" hidden>
    <div class="bar">
      <input type="search" id="aq" placeholder="Search artist, show, or museum" aria-label="Search exhibitions">
    </div>
    <div class="bar" id="aview" role="group" aria-label="Which shows">
      <button class="chip" data-view="now" aria-pressed="true">On view now</button>
      <button class="chip" data-view="closing" aria-pressed="false">Closing soon</button>
      <button class="chip" data-view="opening" aria-pressed="false">Opening soon</button>
      <button class="chip" data-view="all" aria-pressed="false">Everything</button>
    </div>
    <div class="bar" id="aboro" role="group" aria-label="Borough">
      <button class="chip" data-boro="All" aria-pressed="true">All boroughs</button>
      <button class="chip" data-boro="Manhattan" aria-pressed="false">Manhattan</button>
      <button class="chip" data-boro="Brooklyn" aria-pressed="false">Brooklyn</button>
      <select class="venue" id="avenue" aria-label="Museum"><option value="">All museums</option></select>
    </div>
    <p class="count" id="acount"></p>
    <div id="alist" aria-live="polite"><div class="empty">Loading exhibitions…</div></div>
    <footer id="afoot"></footer>
  </section>
</div>

<script>
// ---- Config -----------------------------------------------------------------
// Google Sheet ID (the part between /d/ and /edit in the sheet URL).
// The sheet must be shared as "Anyone with the link: Viewer".
const SHEET_ID = '1bYZzF5qJy1t9mPKH0n1wITES7NlyWGMbi5cRE7iToEI';
// Apps Script web app that records thumbs-downs in the sheet's Hidden tab, so
// they're shared across the family. See apps-script/hide.gs. Leave empty and
// thumbs-downs still work, on this device only.
const HIDE_ENDPOINT = '';

// ---- Not for us -------------------------------------------------------------
// Shared list from the Hidden tab, plus this device's own recent changes (which
// win until the sheet catches up, and are all there is without an endpoint).
let sheetHidden = new Map(); // key -> { title, section }
let localHide = readStore('tgl-hidden', {}); // key -> { hidden, title, section, at }
function readStore(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } }
function writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } }
function isHidden(key) { return key in localHide ? localHide[key].hidden : sheetHidden.has(key); }
function hiddenItems() {
  const all = new Map([...sheetHidden].map(([k, v]) => [k, v]));
  for (const [k, v] of Object.entries(localHide)) all.set(k, v);
  return [...all].filter(([k]) => isHidden(k)).map(([key, v]) => ({ key, title: v.title, section: v.section || 'music' }));
}
async function loadHidden() {
  try {
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Hidden`, { cache: 'no-store' });
    if (!res.ok) return;
    const [header, ...rows] = parseCSV(await res.text());
    if (!header || !header.includes('HiddenAt')) return; // tab not created yet
    const idx = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
    sheetHidden = new Map(rows.filter((r) => r[idx.Key]).map((r) => [r[idx.Key], { title: r[idx.Title], section: r[idx.Section] }]));
    // Drop local overrides the sheet now agrees with.
    if (HIDE_ENDPOINT) for (const [k, v] of Object.entries(localHide)) if (v.hidden === sheetHidden.has(k)) delete localHide[k];
    writeStore('tgl-hidden', localHide);
  } catch { /* offline: local list still applies */ }
}

let toastTimer;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${escapeHTML(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

function setHidden(key, title, section, hidden, quiet) {
  localHide[key] = { hidden, title, section, at: Date.now() };
  writeStore('tgl-hidden', localHide);
  render();
  if (typeof renderArt === 'function' && exhibits.length) renderArt();
  if (!quiet) toast(hidden ? `Hidden: ${title}` : `Back on the list: ${title}`, () => setHidden(key, title, section, !hidden, true));
  syncHidden(key, title, section, hidden);
}

async function syncHidden(key, title, section, hidden) {
  if (!HIDE_ENDPOINT) return;
  let pass = readStore('tgl-pass', '');
  if (!pass) {
    pass = (window.prompt('Family passphrase, so everyone’s thumbs-downs are shared. You’ll only be asked once on this device.') || '').trim();
    if (!pass) return toast('Hidden on this device only.');
    writeStore('tgl-pass', pass);
  }
  try {
    const res = await fetch(HIDE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request, no CORS preflight
      body: JSON.stringify({ passphrase: pass, key, title, section, action: hidden ? 'hide' : 'unhide' }),
    });
    const j = await res.json();
    if (!j.ok && j.error === 'wrong passphrase') {
      writeStore('tgl-pass', '');
      toast('Wrong passphrase. Saved on this device only for now.');
    }
  } catch { /* stays local on this device */ }
}

// One click handler for every thumbs-down and bring-back button on the page.
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-hide],[data-unhide]');
  if (!btn) return;
  const hide = btn.hasAttribute('data-hide');
  const key = hide ? btn.dataset.hide : btn.dataset.unhide;
  const card = btn.closest('.card');
  if (hide && card) {
    card.classList.add('leaving');
    setTimeout(() => setHidden(key, btn.dataset.title, btn.dataset.section, true), 180);
  } else {
    setHidden(key, btn.dataset.title, btn.dataset.section, hide);
  }
});

const SHEET_TAB = 'Sheet1';

// ---- CSV parsing (handles quoted commas and escaped quotes) ----------------
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// ---- Date helpers (New York calendar days) --------------------------------
function todayNY() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
function nowTimeNY() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t).value;
  return `${g('hour')}:${g('minute')}`;
}
function daysBetween(a, b) {
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
}
function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', timeZone:'UTC' });
}
function fmtTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(Date.UTC(2000, 0, 1, h, m)).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'UTC' });
}

// Same rules as briefing.js: buy 10-21 days out, last chance within 3 days.
function recommendation(e, today) {
  if (/sold/i.test(e.status)) return { cls: 'soldout', label: 'Sold out' };
  const d = daysBetween(today, e.date);
  if (d >= 10 && d <= 21) return { cls: 'buy', label: 'Buy now' };
  if (d >= 0 && d <= 3) return { cls: 'last', label: 'Last chance' };
  return null;
}

// ---- State ----------------------------------------------------------------
let events = [];
let genre = 'All';
let when = 'all';

// Date window for the "When" filter, as [first day, last day] inclusive.
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function whenRange(today) {
  const [y, m] = today.split('-').map(Number);
  const dow = new Date(today + 'T12:00:00Z').getUTCDay(); // 0 Sun ... 6 Sat
  const monthEnd = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10);
  switch (when) {
    case 'tonight': return [today, today];
    case 'tomorrow': { const t = addDays(today, 1); return [t, t]; }
    case 'week': return [today, addDays(today, 6)];
    case 'weekend': {
      if (dow === 0) return [today, today];             // Sunday: just today
      if (dow === 6) return [today, addDays(today, 1)]; // Saturday: Sat and Sun
      return [addDays(today, 5 - dow), addDays(today, 7 - dow)]; // Fri to Sun
    }
    case 'month': return [today, monthEnd(y, m)];
    case 'nextmonth': {
      const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
      return [`${ny}-${String(nm).padStart(2, '0')}-01`, monthEnd(ny, nm)];
    }
    default:
      if (/^\d{4}-\d{2}-\d{2}$/.test(when)) return [when, when];
      return null;
  }
}

// ---- Shows: one card per show, however many nights it runs ---------------
// Same key as lib/enrich.js, so the research joins on it.
function fixText(s) { return String(s || '').replace(/\?{3}/g, '’'); }
function showKey(title) {
  return fixText(title).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}
let shows = [];
let research = new Map();
let sortBy = 'top';

function groupShows(evts) {
  const map = new Map();
  for (const e of evts) {
    const key = showKey(e.title);
    if (!map.has(key)) map.set(key, { key, title: fixText(e.title), artist: fixText(e.artist), genres: {}, dates: [] });
    const s = map.get(key);
    s.genres[e.genre] = (s.genres[e.genre] || 0) + 1;
    // Same show, same night from two sources (SmallsLIVE mirrors Smalls and
    // Mezzrow): keep one, preferring the row with a price, link, and time.
    const twin = s.dates.findIndex((d) => d.date === e.date && (!d.time || !e.time || d.time === e.time));
    const fill = (x) => (x.price ? 1 : 0) + (x.url ? 1 : 0) + (x.time ? 1 : 0);
    if (twin < 0) s.dates.push(e);
    else if (fill(e) > fill(s.dates[twin])) s.dates[twin] = e;
  }
  return [...map.values()].map((s) => ({
    ...s,
    genre: Object.entries(s.genres).sort((a, b) => b[1] - a[1])[0][0],
    dates: s.dates.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)),
  }));
}

// Best badge across the nights shown: last chance beats buy now; sold out only if every night is.
function showRec(dates, today) {
  const recs = dates.map((e) => recommendation(e, today));
  return recs.find((r) => r && r.cls === 'last') || recs.find((r) => r && r.cls === 'buy') ||
    (recs.every((r) => r && r.cls === 'soldout') ? recs[0] : null);
}

// Can't miss: the research flagged it and it scores well, or it scores very high.
// Highly reviewed: strong critical reputation. Everything else: also playing.
function tierOf(r) {
  if (!r) return 'rest';
  const score = Number(r.Score) || 0;
  if ((r.CantMiss === 'yes' && score >= 65) || score >= 82) return 'must';
  if (Number(r.Reviews) >= 4 || score >= 62) return 'rated';
  return 'rest';
}
const TIERS = {
  must: ['Can’t miss', 'Rare, landmark, or exceptional nights. Book these.'],
  rated: ['Highly reviewed', 'Acts and productions with real critical weight.'],
  rest: ['Also playing', 'Everything else on the calendar.'],
};

const SIGNALS = [['Reviews', 'Acclaimed'], ['Rarity', 'Rare in NYC'], ['Significance', 'Special night'], ['Hype', 'Buzzing']];

function renderHidden() {
  const items = hiddenItems().sort((a, b) => a.title.localeCompare(b.title));
  document.getElementById('count').textContent = items.length
    ? `${items.length} hidden. These stay off the list${HIDE_ENDPOINT ? ' for everyone' : ' on this device'} until you bring them back.`
    : 'Nothing hidden. Tap “Not for us” on any show or exhibition to take it off the list.';
  document.getElementById('list').innerHTML = items.map((h) => `<div class="hidden-row">
      <div><div class="title">${escapeHTML(h.title)}</div><div class="meta">${h.section === 'art' ? 'Exhibition' : 'Music'}</div></div>
      <button class="nope" data-unhide="${escapeAttr(h.key)}" data-title="${escapeAttr(h.title)}" data-section="${escapeAttr(h.section)}">Bring back</button>
    </div>`).join('');
}

function render() {
  const n = hiddenItems().length;
  document.getElementById('hidden-chip').textContent = n ? `Hidden (${n})` : 'Hidden';
  if (sortBy === 'hidden') return renderHidden();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const today = todayNY();
  const range = whenRange(today);
  const list = [];
  for (const s of shows) {
    if (isHidden(s.key)) continue;
    if (genre !== 'All' && s.genre !== genre) continue;
    const hay = `${s.title} ${s.artist} ${s.dates.map((e) => e.venue).join(' ')}`.toLowerCase();
    if (q && !hay.includes(q)) continue;
    const nights = s.dates.filter((e) => !range || (e.date >= range[0] && e.date <= range[1]));
    const r = research.get(s.key);
    if (sortBy === 'must' && tierOf(r) !== 'must') continue;
    if (nights.length) list.push({ ...s, nights, r, tier: tierOf(r) });
  }
  const scoreOf = (x) => (x.r ? Number(x.r.Score) || 0 : -1);
  const rank = { must: 0, rated: 1, rest: 2 };
  list.sort((a, b) => (sortBy !== 'date' ? rank[a.tier] - rank[b.tier] || scoreOf(b) - scoreOf(a) : 0) ||
    (a.nights[0].date + a.nights[0].time).localeCompare(b.nights[0].date + b.nights[0].time));

  const el = document.getElementById('list');
  const nightCount = list.reduce((n, x) => n + x.nights.length, 0);
  const mustCount = list.filter((x) => x.tier === 'must').length;
  document.getElementById('count').textContent = `${list.length.toLocaleString('en-US')} show${list.length === 1 ? '' : 's'}` +
    (nightCount > list.length ? ` (${nightCount} dates)` : '') +
    (range ? (range[0] === range[1] ? ' on ' + fmtDate(range[0]) : ' from ' + fmtDate(range[0]) + ' to ' + fmtDate(range[1])) : '') +
    (mustCount && sortBy !== 'must' ? ` · ${mustCount} can’t miss` : '');
  if (!list.length) {
    el.innerHTML = `<div class="empty">${sortBy === 'must' ? 'Nothing flagged can’t miss for these dates yet.' : 'No shows match.'}</div>`;
    return;
  }

  let lastTier = null;
  el.innerHTML = list.map((s) => {
    // Section headers when sorting by our picks.
    let head = '';
    if (sortBy !== 'date' && s.tier !== lastTier) {
      lastTier = s.tier;
      head = `<h2 class="section-head ${s.tier}">${TIERS[s.tier][0]}</h2><p class="section-sub">${TIERS[s.tier][1]}</p>`;
    }
    const next = s.nights[0];
    const rec = showRec(s.nights, today);
    const days = daysBetween(today, next.date);
    const soon = days === 0 ? 'Tonight/today' : days === 1 ? 'Tomorrow' : `${days} days`;
    const venues = [...new Set(s.nights.map((e) => e.venue))];
    const more = s.nights.length - 1;
    const r = s.r;
    const tierBadge = s.tier === 'must' ? '<span class="tier must">Can’t miss</span>' : s.tier === 'rated' ? '<span class="tier rated">Highly reviewed</span>' : '';
    const scoreTip = r ? `Score ${r.Score} · Reviews ${r.Reviews}/5 · Rarity ${r.Rarity}/5 · Significance ${r.Significance}/5 · Hype ${r.Hype}/5${r.Confidence === 'low' ? ' · thin info' : ''}` : '';
    const sigs = r && s.tier !== 'rest' ? SIGNALS.filter(([k]) => Number(r[k]) >= 4).map(([, label]) => `<span class="sig">${label}</span>`).join('') : '';
    const link = next.url ? `<a class="ticket" href="${escapeAttr(next.url)}" target="_blank" rel="noopener">Tickets / info →</a>` : '<span class="meta">No link</span>';
    const allDates = more > 0 ? `<details class="dates"><summary>All ${s.nights.length} dates</summary><ul>${s.nights.map((e) => {
      const label = `${fmtDate(e.date)}${e.time ? ' · ' + fmtTime(e.time) : ''}${venues.length > 1 ? ' · ' + escapeHTML(e.venue) : ''}${/sold/i.test(e.status) ? ' · sold out' : ''}`;
      return `<li>${e.url ? `<a href="${escapeAttr(e.url)}" target="_blank" rel="noopener">${label}</a>` : label}</li>`;
    }).join('')}</ul></details>` : '';
    return `${head}<article class="card ${s.tier}"${scoreTip ? ` title="${escapeAttr(scoreTip)}"` : ''}>
      <div>
        <div class="title">${escapeHTML(s.title)}<span class="tag">${escapeHTML(s.genre)}</span></div>
        <div class="meta">${escapeHTML(venues.join(' / '))} · ${more > 0 ? 'Next ' : ''}${fmtDate(next.date)}${next.time ? ' · ' + fmtTime(next.time) : ''} · ${soon}${next.price ? ' · ' + escapeHTML(next.price) : ''}${more > 0 ? ` · +${more} more date${more === 1 ? '' : 's'}` : ''}</div>
      </div>
      <div class="side">${tierBadge}${rec ? `<span class="rec ${rec.cls}">${rec.label}</span>` : ''}</div>
      ${r && r.Description ? `<p class="desc">${escapeHTML(r.Description)}</p>` : '<p class="pending">Description coming with the next morning’s update.</p>'}
      ${r && r.Press && s.tier !== 'rest' ? `<p class="press"><b>Press:</b> ${escapeHTML(r.Press)}</p>` : ''}
      ${r && r.Why && s.tier !== 'rest' ? `<p class="why">${escapeHTML(r.Why)}</p>` : ''}
      ${r && r.FansOf && s.tier !== 'rest' ? `<p class="fans">For fans of ${escapeHTML(r.FansOf)}</p>` : ''}
      ${sigs ? `<div class="sigs">${sigs}</div>` : ''}
      ${allDates}
      <div class="actions"><span class="meta">${escapeHTML([...new Set(s.nights.map((e) => e.source))].join(', '))}</span><span class="act-right"><button class="nope" data-hide="${escapeAttr(s.key)}" data-title="${escapeAttr(s.title)}" data-section="music" title="Hide this show for good">👎 Not for us</button>${link}</span></div>
    </article>`;
  }).join('');
}

// Research from the Enrich tab. Optional: the calendar works without it.
async function loadResearch() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Enrich`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return;
    const [header, ...rows] = parseCSV(await res.text());
    if (!header || !header.includes('Key')) return;
    const idx = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
    research = new Map(rows.filter((r) => r[idx.Key]).map((r) => [r[idx.Key], Object.fromEntries(Object.entries(idx).map(([h, i]) => [h, r[i] || '']))]));
  } catch { /* no research yet */ }
}

function escapeHTML(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s) { return escapeHTML(s); }

async function load() {
  const el = document.getElementById('list');
  if (SHEET_ID.startsWith('PASTE')) {
    el.innerHTML = '<div class="error">Set SHEET_ID in this file to your Google Sheet ID.</div>';
    return;
  }
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Sheet returned ${res.status}. Check that it is shared as "Anyone with the link".`);
    const [header, ...rows] = parseCSV(await res.text());
    const idx = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
    const today = todayNY();
    events = rows
      .filter((r) => r[idx.Title] && r[idx.Date])
      .map((r) => ({
        title: r[idx.Title], artist: r[idx.Artist], date: r[idx.Date], time: r[idx.Time],
        venue: r[idx.Venue], genre: r[idx.Genre] || 'Other', price: r[idx.Price],
        url: r[idx.URL], source: r[idx.Source], status: r[idx.Status] || '', scrapedAt: r[idx.ScrapedAt] || '',
      }))
      .filter((e) => e.date > today || (e.date === today && (!e.time || e.time >= nowTimeNY())))
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    shows = groupShows(events);
    await Promise.all([loadResearch(), loadHidden()]);
    if (exhibits.length) renderArt(); // apply the shared hidden list to art too
    const latest = events.map((e) => e.scrapedAt).filter(Boolean).sort().pop();
    document.getElementById('foot').textContent = latest ? `Data refreshed ${new Date(latest).toLocaleString('en-US')} · ${shows.length} shows, ${shows.reduce((n, s) => n + s.dates.length, 0)} dates · ${research.size ? research.size + ' researched' : 'research pending'}` : '';
    render();
  } catch (err) {
    el.innerHTML = `<div class="error">Could not load the calendar. ${escapeHTML(err.message)}</div>`;
  }
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('sort').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-sort]');
  if (!btn) return;
  sortBy = btn.dataset.sort;
  document.querySelectorAll('#sort button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  render();
});
document.getElementById('genres').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-genre]');
  if (!btn) return;
  genre = btn.dataset.genre;
  document.querySelectorAll('#genres button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  render();
});
document.getElementById('when').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-when]');
  if (!btn) return;
  when = btn.dataset.when;
  document.getElementById('day').value = '';
  document.getElementById('day').classList.remove('on');
  document.querySelectorAll('#when button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  render();
});
document.getElementById('day').addEventListener('change', (ev) => {
  const v = ev.target.value;
  when = v || 'all';
  ev.target.classList.toggle('on', !!v);
  document.querySelectorAll('#when button').forEach((b) => b.setAttribute('aria-pressed', String(!v && b.dataset.when === 'all')));
  render();
});
document.getElementById('day').min = todayNY();

// ---- Art ------------------------------------------------------------------
let exhibits = [];
let aview = 'now', aboro = 'All';

function fmtShort(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const sameYear = y === Number(todayNY().slice(0, 4));
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month:'short', day:'numeric', ...(sameYear ? {} : { year:'numeric' }), timeZone:'UTC' });
}
function whenText(e, today) {
  if (e.start && e.start > today) return `Opens ${fmtShort(e.start)}${e.end ? ' · through ' + fmtShort(e.end) : ''}`;
  if (e.end) return `Through ${fmtShort(e.end)}`;
  return 'Ongoing';
}
function artBadge(e, today) {
  if (e.end && e.end >= today && daysBetween(today, e.end) <= 21) return { cls:'last', label: daysBetween(today, e.end) <= 7 ? 'Last week' : 'Closing soon' };
  if (e.start && e.start <= today && daysBetween(e.start, today) <= 14) return { cls:'new', label:'Just opened' };
  if (e.start && e.start > today && daysBetween(today, e.start) <= 30) return { cls:'buy', label:'Opening soon' };
  return null;
}
function artKey(e) { return 'art:' + showKey(`${e.title} ${e.venue}`); }
function renderArt() {
  const q = document.getElementById('aq').value.trim().toLowerCase();
  const venue = document.getElementById('avenue').value;
  const today = todayNY();
  const in45 = addDays(today, 45), in60 = addDays(today, 60);
  const onView = (e) => (!e.start || e.start <= today) && (!e.end || e.end >= today);
  let list = exhibits.filter((e) => !isHidden(artKey(e)) &&
    (aboro === 'All' || e.borough === aboro) &&
    (!venue || e.venue === venue) &&
    (!q || `${e.title} ${e.venue}`.toLowerCase().includes(q)) &&
    (aview === 'all' ||
     (aview === 'now' && onView(e)) ||
     (aview === 'closing' && onView(e) && e.end && e.end <= in45) ||
     (aview === 'opening' && e.start && e.start > today && e.start <= in60)));
  if (aview === 'opening') list = list.sort((a, b) => a.start.localeCompare(b.start));
  const label = { now:'on view now', closing:'closing in the next 45 days', opening:'opening in the next 60 days', all:'listed' }[aview];
  document.getElementById('acount').textContent = `${list.length} exhibition${list.length === 1 ? '' : 's'} ${label}`;
  const el = document.getElementById('alist');
  if (!list.length) { el.innerHTML = '<div class="empty">Nothing matches.</div>'; return; }
  el.innerHTML = list.map((e) => {
    const b = artBadge(e, today);
    const link = e.url ? `<a class="ticket" href="${escapeAttr(e.url)}" target="_blank" rel="noopener">Details →</a>` : '';
    return `<article class="card">
      <div>
        <div class="title">${escapeHTML(e.title)}</div>
        <div class="meta">${escapeHTML(e.venue)} · ${escapeHTML(e.borough)} · ${escapeHTML(whenText(e, today))}</div>
      </div>
      ${b ? `<span class="rec ${b.cls}">${b.label}</span>` : ''}
      <div class="actions"><span class="meta"></span><span class="act-right"><button class="nope" data-hide="${escapeAttr(artKey(e))}" data-title="${escapeAttr(e.title)}" data-section="art" title="Hide this exhibition for good">👎 Not for us</button>${link}</span></div>
    </article>`;
  }).join('');
}
async function loadArt() {
  const el = document.getElementById('alist');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Art`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Sheet returned ${res.status}.`);
    const [header, ...rows] = parseCSV(await res.text());
    const idx = Object.fromEntries(header.map((h, i) => [h.trim(), i]));
    const today = todayNY();
    exhibits = rows.filter((r) => r[idx.Title]).map((r) => ({
      title: r[idx.Title], venue: r[idx.Venue], borough: r[idx.Borough] || 'Manhattan',
      start: r[idx.Start] || '', end: r[idx.End] || '', url: r[idx.URL], scrapedAt: r[idx.ScrapedAt] || '',
    })).filter((e) => !e.end || e.end >= today);
    const sel = document.getElementById('avenue');
    const keep = sel.value;
    sel.innerHTML = '<option value="">All museums</option>' + [...new Set(exhibits.map((e) => e.venue))].sort().map((v) => `<option>${escapeHTML(v)}</option>`).join('');
    sel.value = keep;
    const latest = exhibits.map((e) => e.scrapedAt).filter(Boolean).sort().pop();
    document.getElementById('afoot').textContent = latest ? `Refreshed ${new Date(latest).toLocaleString('en-US')} · ${[...new Set(exhibits.map((e) => e.venue))].length} museums` : '';
    renderArt();
  } catch (err) {
    el.innerHTML = `<div class="error">Could not load exhibitions. ${escapeHTML(err.message)}</div>`;
  }
}
document.getElementById('aq').addEventListener('input', renderArt);
document.getElementById('avenue').addEventListener('change', renderArt);
document.getElementById('aview').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-view]'); if (!btn) return;
  aview = btn.dataset.view;
  document.querySelectorAll('#aview button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  renderArt();
});
document.getElementById('aboro').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-boro]'); if (!btn) return;
  aboro = btn.dataset.boro;
  document.querySelectorAll('#aboro button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  renderArt();
});

// ---- Tabs (#music / #art, so each has its own link) ----------------------
function showTab() {
  const tab = location.hash === '#art' ? 'art' : 'music';
  document.getElementById('music-section').hidden = tab !== 'music';
  document.getElementById('art-section').hidden = tab !== 'art';
  document.querySelectorAll('.tabs a').forEach((a) => {
    if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
window.addEventListener('hashchange', showTab);
showTab();
loadArt();
setInterval(loadArt, 30 * 60 * 1000);

load();
setInterval(load, 15 * 60 * 1000);
</script>
